name: Refresh public game catalogue
on:
  schedule:
    - cron: '17 */3 * * *'
  workflow_dispatch:
    inputs:
      full_catalog:
        description: 'Rescan the complete series graph (slower; weekly by default)'
        type: boolean
        default: false
permissions:
  contents: write
concurrency:
  group: public-game-data
  cancel-in-progress: false
jobs:
  refresh:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/light-dynamic-games
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
      - run: npm ci --ignore-scripts
      - uses: actions/checkout@v4
        with:
          ref: codex/catalog-data
          path: published-data
      - name: Update public snapshots within request budgets
        env:
          CATALOG_OUTPUT: published-data/v1
          CATALOG_REQUEST_BUDGET: '220'
          NEWS_REQUEST_BUDGET: '24'
          COVER_REQUEST_BUDGET: '12'
          FULL_CATALOG: ${{ inputs.full_catalog }}
        run: |
          if [ "$FULL_CATALOG" = 'true' ] || [ "$(date -u +%u-%H)" = '1-00' ]; then
            node scripts/refresh-public-data.mjs --full
          elif [ "$(date -u +%H)" = '00' ]; then
            node scripts/refresh-public-data.mjs --platforms --assets
          else
            node scripts/refresh-public-data.mjs
          fi
      - name: Publish the complete successful snapshot
        working-directory: published-data
        run: |
          git config user.name 'release-signal-data[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -- v1
          if ! git diff --cached --quiet; then
            git commit -m 'Refresh verified public game data'
            git push origin HEAD:codex/catalog-data
          fi
